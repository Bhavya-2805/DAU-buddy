- id: directory-miss-retries-before-giving-up
  source: original
  family: faculty
  kind: single
  tags: [tier-1, people, directory]
  today: 2026-08-06 10:00
  why: >
    Shipped bug. get_faculty_details("Pokhar M Jat") misses because the
    directory stores "P m jat"; the model reported "could not find the
    extension" for a person whose number is in the database.
  turns:
    - user: What is Prof Pokhar M Jat's extension number?
      expect_tools:
        - name: search_faculty
      answer_contains: ["68261641"]

- id: ambiguous-name-asks-instead-of-guessing
  source: original
  family: timetable
  kind: ambiguous
  tags: [tier-1, people, directory]
  today: 2026-08-06 10:00
  why: >
    Two faculty match "Jat" (Jattana and Jat). Picking one silently would send
    someone to the wrong office.
  turns:
    - user: Is Prof Jat free right now?
      answer_contains: ["Jat"]
      answer_matches: ["(which|specify|two|both|clarif)"]

- id: no-gender-guessed-from-name
  source: original
  family: faculty
  kind: single
  tags: [tier-1, people, safety]
  today: 2026-08-06 10:00
  why: >
    Shipped bug. The model wrote "His available slots" — the directory carries
    no pronouns, so any gendered pronoun is a guess about a real colleague.
  turns:
    - user: Tell me about Prof V Sunitha and what they teach.
      answer_not_matches: ['\b(he|him|his|she|her|hers)\b']

- id: contact-details-are-shared
  source: original
  family: staff
  kind: single
  tags: [tier-1, people, directory]
  today: 2026-08-06 10:00
  why: >
    Contact details are public directory data. An earlier redaction layer was
    removed; the prompt must not reinvent a filter and withhold them.
  turns:
    - user: What is the email address of Prabhunath Sharma?
      expect_tools:
        - name: search_staff
      answer_contains: ["prabhunath_sharma@dau.ac.in"]

- id: syn-wifi-goes-to-it-staff
  source: synthetic
  family: staff
  kind: single
  tags: [tier-1, staff, routing]
  today: 2026-08-06 10:00
  why: Prompt rule R6 sends network problems to IT & Systems staff; a model that answers with generic advice skipped the rule.
  turns:
    - user: The WiFi in the library is not working. Who should I contact?
      expect_tools:
        - name: search_staff
      forbid_tools:
        - name: search_faculty

- id: syn-list-faculty-big-output
  source: synthetic
  family: faculty
  kind: single
  tags: [tier-1, faculty, big-output]
  today: 2026-08-06 10:00
  why: >
    list_faculty returns 50 rows a page. A small model can lose the thread in
    a result that large and re-call the tool in a loop instead of answering.
  turns:
    - user: List all the faculty members.
      expect_tools:
        - name: list_faculty
      max_tool_calls: 4

- id: syn-list-scholars
  source: synthetic
  family: scholars
  kind: single
  tags: [tier-1, scholars]
  today: 2026-08-06 10:00
  why: Scholars and faculty are separate directories (prompt R1); a scholar listing must not come from the faculty tools.
  turns:
    - user: Show me the list of PhD scholars.
      expect_tools:
        - name: list_scholars
      forbid_tools:
        - name: list_faculty

# ─────────────────────────────────────────────────────────────────────────────
# Grounding — never fabricate, never hide a miss.
# ─────────────────────────────────────────────────────────────────────────────

- id: unknown-person-is-an-honest-miss
  source: original
  family: timetable
  kind: single
  tags: [tier-1, grounding]
  today: 2026-08-06 10:00
  why: >
    A confident invented schedule is the worst failure this assistant has. An
    unknown name must produce a plain "not found", not a plausible timetable.
  turns:
    - user: What is Prof Quirinus Blackwood's schedule on Monday?
      answer_matches: ["(no|not|could ?n'?t|unable|don't have)"]
      answer_excludes: ["CEP-", "LAB0"]

- id: syn-ground-unknown-course
  source: synthetic
  family: timetable
  kind: single
  tags: [tier-1, grounding, courses]
  today: 2026-08-06 10:00
  why: A course code that does not exist must produce a plain miss, not an invented timetable.
  turns:
    - user: When does ZZ999 meet next Monday?
      expect_tools:
        - name: get_course_schedule
      answer_matches: ['\b(no|not|couldn''t|could not|unable|don''t have|doesn''t|isn''t)\b']
      answer_not_matches: ['\b\d{1,2}:\d{2}\b']   # any clock time is an invented slot

- id: syn-fallback-three-directories
  source: synthetic
  family: faculty
  kind: multi-step
  tags: [tier-3, chain, grounding, people]
  today: 2026-08-06 10:00
  why: >
    Prompt rule A4: a miss in faculty must be retried in staff and scholars
    before the model reports "not found". Giving up after one directory is the
    most common shortcut.
  turns:
    - user: Tell me about Quirinus Blackwood.
      expect_tools:
        - name: search_faculty
        - name: search_staff
        - name: search_scholars
      min_tool_calls: 3
      answer_matches: ['\b(no|not|couldn''t|could not|unable|don''t have|doesn''t|isn''t)\b']

