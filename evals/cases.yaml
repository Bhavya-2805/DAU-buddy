# DAU Buddy behavioural eval set.
#
# Each case runs real user turns through the real chat pipeline (real prompt,
# real tools, real model) and checks what came back. Assertions come in two
# kinds, and the first is the one to reach for:
#
#   TRAJECTORY  which tools were called, how many, in what order, with which
#               arguments. Stable, because it does not depend on wording.
#                 expect_tools      a tool was called (optionally args_include)
#                 forbid_tools      a tool was NOT called with those arguments
#                 expect_no_tools   no tool at all this turn
#                 min_tool_calls    / max_tool_calls — count of calls this turn
#                 tool_order        these tools appear in this order (others
#                                   may be interleaved)
#                 args_from_results [{tool, arg}] — that argument must appear in
#                                   an EARLIER tool result: the model read the
#                                   id, it did not invent it
#   TEXT        answer_contains / answer_excludes / answer_matches /
#               answer_not_matches. Use sparingly and only for facts, never for
#               phrasing.
#
# Every case pins `today:` so "tomorrow" means something fixed. Unless a case
# says otherwise it is Thursday 2026-08-06 10:00, so
#   tomorrow    = 2026-08-07 (a Friday the calendar treats as a Tuesday)
#   next Monday = 2026-08-10
#   15 August   = 2026-08-15 (Independence Day, a Saturday)
#
# Every case carries `why:` — the bug it exists to catch. A case whose `why`
# you cannot write is a case you do not need.
#
# Every case carries `family` (the tool family the question is about) and
# `kind` (single | multi-step | no-tool | out-of-scope | ambiguous). They feed
# the coverage table in evals/README.md: `python -m evals.coverage`.
#
# TIERS. Every case is tagged tier-N: the number of tool calls the hardest
# single turn needs. This is how the suite tells a model that can look things up
# from one that can plan.
#   tier-0  no tool needed: greetings, out-of-scope, injection, a question too
#           vague to look up
#   tier-1  one lookup (multi-turn cases are tier-1 per turn, tagged multi-turn)
#   tier-2  two calls: a dependent chain (B needs A's output) or two intents
#   tier-3  three calls
#   tier-4  four calls
# Run one tier with `--tag tier-3`; summary.json reports the pass rate per tier.
# Tags `chain` (a later call needs an earlier result) and `parallel`
# (independent calls in one message) separate the two ways a model can need
# several calls.
#
# `source:` is `original` (written against shipped bugs) or `synthetic` (written
# from the tool schemas and the system prompt, NOT yet run against the database:
# read each failure before trusting it). Expected arguments avoid name strings,
# which the runner compares exactly; they are dates, weekdays, course codes,
# semesters and capacities. Every case here, whatever its source, must be kept
# out of the fine-tuning corpus.

# ─────────────────────────────────────────────────────────────────────────────
# Day order — the academic calendar reassigns some dates to another weekday.
# ─────────────────────────────────────────────────────────────────────────────

- id: dated-schedule-uses-effective-day
  source: original
  family: timetable
  kind: single
  tags: [tier-1, day-order, timetable]
  today: 2026-08-06 10:00
  why: >
    Shipped bug. "Schedule tomorrow" returned Friday's classes even though the
    calendar reassigns 2026-08-07 to Tuesday. The model derived the weekday
    itself and passed day="Friday"; the date never reached a tool.
  turns:
    - user: What is Prof V Sunitha's schedule tomorrow?
      expect_tools:
        - name: get_faculty_schedule
          args_include: {date: "2026-08-07"}
      forbid_tools:
        - name: get_faculty_schedule
          args_include: {day: "Friday"}
      answer_contains: ["Tuesday", "14:00"]
      answer_excludes: ["12:00"]   # Friday's LAB004 lab must not appear

- id: day-order-question-answered-from-calendar
  source: original
  family: calendar
  kind: single
  tags: [tier-1, day-order, calendar]
  today: 2026-08-06 10:00
  why: >
    Shipped bug. "Is tomorrow treated as Tuesday?" was answered from the
    injected date ("no, tomorrow is Friday") without consulting the calendar,
    which holds an event literally named "To be treated as Tuesday".
  turns:
    - user: Is tomorrow treated as Tuesday?
      expect_tools:
        - name: get_events_by_date
          args_include: {date_str: "2026-08-07"}
      answer_contains: ["Tuesday"]

- id: generic-weekday-is-not-a-date
  source: original
  family: timetable
  kind: single
  tags: [tier-1, day-order, timetable]
  today: 2026-08-06 10:00
  why: >
    The mirror of the bug above: "on Fridays" genuinely means any Friday, so
    the model must NOT convert it into a specific date and resolve it.
  turns:
    - user: What does Prof V Sunitha teach on Fridays?
      expect_tools:
        - name: get_faculty_schedule
          args_include: {day: "Friday"}
      answer_contains: ["Friday"]

- id: syn-faculty-schedule-next-monday
  source: synthetic
  family: timetable
  kind: single
  tags: [tier-1, day-order, timetable]
  today: 2026-08-06 10:00
  why: A named future date must be resolved to an exact date before the tool call (prompt R2).
  turns:
    - user: Show me Prof V Sunitha's timetable for next Monday.
      expect_tools:
        - name: get_faculty_schedule
          args_include: {date: "2026-08-10"}
      forbid_tools:
        - name: get_faculty_schedule
          args_include: {day: "Monday"}

- id: syn-course-schedule-tomorrow
  source: synthetic
  family: timetable
  kind: single
  tags: [tier-1, day-order, courses]
  today: 2026-08-06 10:00
  why: "'Tomorrow' for a course must become a date, so the calendar's day reassignment applies."
  turns:
    - user: Is there an IC101 class tomorrow?
      expect_tools:
        - name: get_course_schedule
          args_include: {course_code: "IC101", date: "2026-08-07"}

- id: syn-class-on-a-holiday
  source: synthetic
  family: timetable
  kind: single
  tags: [tier-1, day-order, courses]
  today: 2026-08-06 10:00
  why: >
    15 August is a national holiday and a Saturday. A model that answers from
    the weekly pattern invents a class; passing the date lets the tool say
    there is none.
  turns:
    - user: Is there an IC101 class on 15 August?
      expect_tools:
        - name: get_course_schedule
          args_include: {course_code: "IC101", date: "2026-08-15"}
      answer_matches: ["(holiday|independence|saturday|weekend|no (scheduled )?class)"]

- id: syn-typo-schedule
  source: synthetic
  family: timetable
  kind: single
  tags: [tier-1, day-order, typo]
  today: 2026-08-06 10:00
  why: Misspelled, abbreviated input must still reach the timetable tool with a resolved date.
  turns:
    - user: wat is prof sunita's schedul tmrw
      expect_tools:
        - name: get_faculty_schedule
          args_include: {date: "2026-08-07"}

# ─────────────────────────────────────────────────────────────────────────────
# Moment-in-time questions — tools return a whole day; "now" is a point in it.
# ─────────────────────────────────────────────────────────────────────────────

- id: free-right-now-is-answered-for-now
  source: original
  family: timetable
  kind: single
  tags: [tier-1, time, timetable]
  today: 2026-08-06 15:18
  why: >
    Shipped bug. The model relayed the day's free windows and asserted "is free
    right now" without checking whether 15:18 fell inside one. The prompt also
    gave it no clock at all.
  turns:
    - user: Is Prof V Sunitha free right now?
      expect_tools:
        - name: find_faculty_free_time
      answer_excludes: ["08:00 - 09:00", "08:00-09:00"]  # a window already past

- id: free-room-now-uses-campus-time
  source: original
  family: venues
  kind: single
  tags: [tier-1, time, rooms]
  today: 2026-08-06 15:18
  why: >
    The promoted welcome-grid query. Naive datetime.now() in a UTC container
    answered for 09:48 while campus ran 15:18.
  turns:
    - user: Which classroom is free right now?
      expect_tools:
        - name: find_free_venues
      answer_contains: ["CEP"]

- id: syn-free-rooms-on-a-weekend
  source: synthetic
  family: venues
  kind: single
  tags: [tier-1, time, rooms]
  today: 2026-08-08 11:00
  why: >
    Venue availability is only defined Monday-Friday 08:00-18:00. On a Saturday
    the honest answer says so; listing "free" rooms from the weekly pattern
    is invented.
  turns:
    - user: Which classrooms are free right now?
      expect_tools:
        - name: find_free_venues
      answer_matches: ["(saturday|weekend|monday|friday|no classes|closed)"]

- id: syn-whole-week-free
  source: synthetic
  family: timetable
  kind: single
  tags: [tier-1, timetable]
  today: 2026-08-06 10:00
  why: Prompt rule R2 requires day="All" for a whole-week question; omitting it silently answers for today only.
  turns:
    - user: When is Prof V Sunitha free this week?
      expect_tools:
        - name: find_faculty_free_time
          args_include: {day: "All"}

- id: syn-common-free-three-faculty
  source: synthetic
  family: timetable
  kind: single
  tags: [tier-1, timetable, array-args]
  today: 2026-08-06 10:00
  why: >
    One find_common_free_time call takes a list of names. Small models either
    break the array argument or make one call per person and intersect the
    windows themselves, which the prompt forbids.
  turns:
    - user: Find a time next Monday when Prof V Sunitha, Prof Pokhar M Jat and Prof Manish Khare are all free.
      expect_tools:
        - name: find_common_free_time
          args_include: {date: "2026-08-10"}
      max_tool_calls: 3

# ─────────────────────────────────────────────────────────────────────────────
# People — two name spaces, ambiguity, pronouns.
